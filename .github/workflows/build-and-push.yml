name: Build and Push PostgreSQL Client Docker Image

on:
  schedule:
    # Run every Monday at 8:00 AM UTC (Monday morning)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual triggering

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      latest: ${{ steps.versions.outputs.latest }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get supported PostgreSQL versions
      id: versions
      run: |
        versions="$(./scripts/get-supported-versions.sh)"
        [ -n "$versions" ] || { echo "No supported versions found"; exit 1; }
        echo "matrix=$(echo "$versions" | jq -R . | jq -sc '{pg: .}')" >> "$GITHUB_OUTPUT"
        echo "latest=$(echo "$versions" | tail -n 1)" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.versions.outputs.matrix) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validate Docker Hub credentials
      run: |
        if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
          echo "Error: DOCKER_USERNAME or DOCKER_PASSWORD secrets are not set"
          exit 1
        fi

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: jnovent/postgres-client
        flavor: latest=false
        tags: |
          type=raw,value=${{ matrix.pg }}
          type=raw,value=${{ matrix.pg }}-{{date 'YYYYMMDD'}}
          type=raw,value=latest,enable=${{ matrix.pg == needs.versions.outputs.latest }}

    - name: Extract metadata (non-root)
      id: meta-nonroot
      uses: docker/metadata-action@v5
      with:
        images: jnovent/postgres-client
        flavor: latest=false
        tags: |
          type=raw,value=${{ matrix.pg }}-nonroot
          type=raw,value=${{ matrix.pg }}-{{date 'YYYYMMDD'}}-nonroot
          type=raw,value=nonroot,enable=${{ matrix.pg == needs.versions.outputs.latest }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        build-args: PG_VERSION=${{ matrix.pg }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push non-root Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.nonroot
        platforms: linux/amd64,linux/arm64
        build-args: PG_VERSION=${{ matrix.pg }}
        push: true
        tags: ${{ steps.meta-nonroot.outputs.tags }}
        labels: ${{ steps.meta-nonroot.outputs.labels }}
